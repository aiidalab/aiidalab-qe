---
services:

    aiidalab:
        image: ${REGISTRY:-}${QE_IMAGE:-aiidalab/qe}${TAG:-}
        environment:
            TZ: Europe/Zurich
            SETUP_DEFAULT_AIIDA_PROFILE: 'true'
            AIIDALAB_DEFAULT_APPS: ''
            JUPYTER_TOKEN: ${JUPYTER_TOKEN}
        ports:
            - 0.0.0.0:${AIIDALAB_PORT:-8998}:8888
        healthcheck:
            test: ["CMD-SHELL", "/etc/jupyter/docker_healthcheck.py || exit 1"]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s