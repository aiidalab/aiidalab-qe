---
# Default parameters for the QeAppWorkChain widgets initialization
# The builder is not directly effected by this file.

workchain:
    relax_type: positions_cell
    ## Properties
    properties: []
    ## Material settings
    spin_type: none
    electronic_type: metal

    ## Calculation settings
    protocol: balanced

## Advanced pw settings
advanced:
    clean_workdir: false
    on_unhandled_failure: pause
    pseudo_family:
        library: SSSP
        version: 1.3
        functional: PBEsol
        accuracy: efficiency
    tot_charge: 0
    vdw_corr: none

## Computational resources
codes:
    dos:
        code: dos-{QE_VERSION}@localhost
    projwfc:
        code: projwfc-{QE_VERSION}@localhost
    projwfc_bands:
        code: projwfc-{QE_VERSION}@localhost
    pw:
        code: pw-{QE_VERSION}@localhost
    pp:
        code: pp-{QE_VERSION}@localhost
    xspectra:
        code: xspectra-{QE_VERSION}@localhost
    hp:
        code: hp-{QE_VERSION}@localhost

summary_format: table
